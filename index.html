<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Ratings Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Tutor Ratings Dashboard</h1>
            <p class="text-muted">by Juan Rivera</p>
        </div>

      
        <div class="row">
           
            <div class="col-lg-4 col-md-12 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center">Rating Distribution</h5>
                        <canvas id="histogramChart"></canvas>
                    </div>
                </div>
            </div>

            
            <div class="col-lg-4 col-md-12 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center">Ratings by Subject</h5>
                        <canvas id="boxplotChart"></canvas>
                    </div>
                </div>
            </div>

           
            <div class="col-lg-4 col-md-12 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center">Sessions vs Rating</h5>
                        <canvas id="scatterplotChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.0/build/index.umd.min.js"></script>
    
    <script src="script.js"></script>

</body>
</html>
